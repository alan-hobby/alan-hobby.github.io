<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="{{ '/' | relative_url }}">
{%- if site.avatar %}<img class="brand-avatar" src="{{ site.avatar | relative_url }}" alt="" width="30" height="30">{% endif -%}
<span class="brand-name">{{ site.title }}</span>
{%- if site.tagline %}<span class="brand-tag">{{ site.tagline }}</span>{% endif -%}
</a>
<nav class="modnav" aria-label="收藏分类">
{%- for m in site.data.modules -%}
{%- assign is_here = false -%}
{%- if page.collection == m.id or page.module == m.id -%}{%- assign is_here = true -%}{%- endif %}
<a href="{{ m.url | relative_url }}"{% if is_here %} aria-current="page"{% endif %}>{{ m.name }}</a>
{%- endfor %}
</nav>
<div class="tools">
<div class="search">
<label for="site-search">搜索</label>
<input id="site-search" type="search" placeholder="车模、游戏、电影、小说" autocomplete="off" aria-controls="search-results">
<div class="search-results" id="search-results" hidden></div>
</div>
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="暗色模式" aria-pressed="false" title="切换亮色 / 暗色">
<svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
<svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
</button>
</div>
</div>
</header>
