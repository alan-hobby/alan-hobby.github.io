<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // 先确定亮色 / 暗色，避免页面闪一下
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.subtitle | default: site.description }}">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{%- if site.avatar %}
<meta property="og:image" content="{{ site.avatar | absolute_url }}">
<link rel="icon" href="{{ site.avatar | relative_url }}">
{%- endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %} data-search="{{ '/search.json' | relative_url }}">
<a class="skip" href="#main">跳到正文</a>
{% include topbar.html %}
{{ content }}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
